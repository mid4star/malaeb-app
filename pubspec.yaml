name: malaeb_app
description: "Malaeb - Next-gen sports and live streaming application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Networking & Cryptography
  http: ^1.2.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Media & Video Playback
  video_player: ^2.8.2
  chewie: ^1.7.5
  wakelock_plus: ^1.1.4
  
  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  
  # UI & Design
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
