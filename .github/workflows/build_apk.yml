name: Build Malaeb APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Official Android Platform Wrapper & Update Gradle
        run: |
          # Backup our customized Manifest
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          
          # Regenerate official Gradle wrapper and build scripts
          flutter create --org com.malaeb --project-name malaeb_app --platforms=android .
          
          # Restore our custom Manifest
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          
          # Force Gradle wrapper to 8.4 as required by Android Gradle Plugin 8.3+
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          
          # Ensure AndroidX and Jetifier are enabled
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split per ABI APKs (Optimized ARM64)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: malaeb-release-apk
          path: build/app/outputs/flutter-apk/*.apk
